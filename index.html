<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="中国移动业务科普网站 - 宽带、5G、智能家居、网络优化等实用知识一站式了解">
  <meta name="theme-color" content="#00A650">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%2300A650'/%3E%3Cpath d='M8 12h2v8H8zm4-3h2v11h-2zm4 5h2v6h-2zm4-4h2v10h-2zm4 1h2v9h-2z' fill='white'/%3E%3C/svg%3E">

  <!-- CSS -->
  
  <style>
/* ===== 中国移动品牌设计令牌 ===== */
:root {
  --cm-primary: #00A650;
  --cm-primary-dark: #00843D;
  --cm-primary-light: #E8F5E9;
  --cm-primary-gradient: linear-gradient(135deg, #00A650, #009A44);
  --cm-secondary: #FF6B00;
  --cm-accent: #2196F3;

  --cm-white: #FFFFFF;
  --cm-bg: #F5F7FA;
  --cm-bg-card: #FFFFFF;
  --cm-bg-hover: #F0FFF4;

  --cm-text-primary: #1A1A2E;
  --cm-text-secondary: #6B7280;
  --cm-text-light: #9CA3AF;
  --cm-text-white: #FFFFFF;

  --cm-border: #E5E7EB;
  --cm-border-light: #F0F0F0;

  --cm-shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --cm-shadow: 0 2px 8px rgba(0,0,0,0.08);
  --cm-shadow-md: 0 4px 12px rgba(0,0,0,0.1);
  --cm-shadow-hover: 0 4px 16px rgba(0,166,80,0.15);

  --cm-radius-xs: 4px;
  --cm-radius-sm: 8px;
  --cm-radius: 12px;
  --cm-radius-lg: 16px;
  --cm-radius-xl: 24px;

  --cm-transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);

  --cm-font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --cm-font-size-xs: 12px;
  --cm-font-size-sm: 14px;
  --cm-font-size-base: 16px;
  --cm-font-size-lg: 18px;
  --cm-font-size-xl: 22px;
  --cm-font-size-2xl: 28px;
  --cm-font-size-3xl: 36px;

  --cm-line-height: 1.75;
  --cm-line-height-heading: 1.3;

  --cm-space-xs: 4px;
  --cm-space-sm: 8px;
  --cm-space-md: 16px;
  --cm-space-lg: 24px;
  --cm-space-xl: 32px;
  --cm-space-2xl: 48px;
  --cm-space-3xl: 64px;

  --cm-header-height: 64px;
  --cm-max-width: 1200px;
  --cm-content-max-width: 800px;
}

/* ===== 暗色模式（未来扩展） ===== */
@media (prefers-color-scheme: dark) {
  /* 暂不支持，但预留变量结构 */
}

/* ===== CSS Reset ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: var(--cm-font);
  font-size: var(--cm-font-size-base);
  line-height: var(--cm-line-height);
  color: var(--cm-text-primary);
  background: var(--cm-bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
ul, ol { list-style: none; }
button { cursor: pointer; font: inherit; color: inherit; border: none; background: none; }
input { font: inherit; color: inherit; }
h1,h2,h3,h4,h5,h6 { line-height: var(--cm-line-height-heading); }

/* ===== Layout System ===== */

/* ---- Container ---- */
.container {
  max-width: var(--cm-max-width);
  margin: 0 auto;
  padding: 0 var(--cm-space-lg);
}

.container--narrow {
  max-width: var(--cm-content-max-width);
}

/* ---- Header ---- */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--cm-white);
  border-bottom: 1px solid var(--cm-border-light);
  height: var(--cm-header-height);
  backdrop-filter: blur(12px);
}

.header__inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 100%;
  max-width: var(--cm-max-width);
  margin: 0 auto;
  padding: 0 var(--cm-space-lg);
}

.header__logo {
  display: flex;
  align-items: center;
  gap: var(--cm-space-sm);
  font-size: var(--cm-font-size-lg);
  font-weight: 700;
  color: var(--cm-primary);
  flex-shrink: 0;
}

.header__logo svg {
  width: 32px;
  height: 32px;
}

.header__nav {
  display: flex;
  align-items: center;
  gap: var(--cm-space-xs);
}

.header__nav-link {
  padding: var(--cm-space-sm) var(--cm-space-md);
  border-radius: var(--cm-radius-sm);
  font-size: var(--cm-font-size-sm);
  color: var(--cm-text-secondary);
  transition: var(--cm-transition);
  white-space: nowrap;
}

.header__nav-link:hover,
.header__nav-link--active {
  color: var(--cm-primary);
  background: var(--cm-primary-light);
}

.header__actions {
  display: flex;
  align-items: center;
  gap: var(--cm-space-sm);
}

.header__search-btn {
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--cm-radius-sm);
  color: var(--cm-text-secondary);
  transition: var(--cm-transition);
}

.header__search-btn:hover {
  color: var(--cm-primary);
  background: var(--cm-primary-light);
}

.header__menu-btn {
  display: none;
  width: 40px;
  height: 40px;
  align-items: center;
  justify-content: center;
  border-radius: var(--cm-radius-sm);
  color: var(--cm-text-primary);
}

/* ---- Footer ---- */
.footer {
  background: #1A1A2E;
  color: rgba(255,255,255,0.7);
  padding: var(--cm-space-2xl) 0 var(--cm-space-lg);
  margin-top: var(--cm-space-3xl);
}

.footer__inner {
  max-width: var(--cm-max-width);
  margin: 0 auto;
  padding: 0 var(--cm-space-lg);
}

.footer__grid {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr;
  gap: var(--cm-space-xl);
  padding-bottom: var(--cm-space-xl);
  border-bottom: 1px solid rgba(255,255,255,0.1);
  margin-bottom: var(--cm-space-lg);
}

.footer__brand h3 {
  font-size: var(--cm-font-size-xl);
  color: var(--cm-white);
  margin-bottom: var(--cm-space-sm);
}

.footer__brand p {
  font-size: var(--cm-font-size-sm);
}

.footer__links h4 {
  color: var(--cm-white);
  font-size: var(--cm-font-size-base);
  margin-bottom: var(--cm-space-md);
}

.footer__links a {
  display: block;
  font-size: var(--cm-font-size-sm);
  margin-bottom: var(--cm-space-sm);
  transition: var(--cm-transition);
}

.footer__links a:hover { color: var(--cm-primary); }

.footer__bottom {
  text-align: center;
  font-size: var(--cm-font-size-xs);
}

/* ---- Mobile Nav Overlay ---- */
.mobile-nav-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  opacity: 0;
  transition: opacity 0.3s;
}

.mobile-nav-overlay--visible {
  opacity: 1;
}

.mobile-nav {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: 280px;
  background: var(--cm-white);
  z-index: 210;
  transform: translateX(100%);
  transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
  padding: var(--cm-space-lg);
  display: flex;
  flex-direction: column;
}

.mobile-nav--open { transform: translateX(0); }

.mobile-nav__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--cm-space-lg);
}

.mobile-nav__links {
  display: flex;
  flex-direction: column;
  gap: var(--cm-space-xs);
}

.mobile-nav__links a {
  padding: var(--cm-space-md);
  border-radius: var(--cm-radius-sm);
  font-size: var(--cm-font-size-base);
  transition: var(--cm-transition);
}

.mobile-nav__links a:hover {
  background: var(--cm-primary-light);
  color: var(--cm-primary);
}

.mobile-nav__close {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--cm-radius-sm);
}

/* ---- Back to Top ---- */
.back-to-top {
  position: fixed;
  bottom: 32px;
  right: 32px;
  width: 48px; height: 48px;
  background: var(--cm-primary);
  color: var(--cm-white);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--cm-shadow-md);
  opacity: 0;
  transform: translateY(10px);
  pointer-events: none;
  transition: var(--cm-transition);
  z-index: 50;
}

.back-to-top--visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.back-to-top:hover {
  background: var(--cm-primary-dark);
  transform: translateY(0) scale(1.05);
}

/* ---- Main Content ---- */
.main-content {
  min-height: calc(100vh - var(--cm-header-height) - 300px);
}

/* ---- Section ---- */
.section {
  padding: var(--cm-space-2xl) 0;
}

.section__header {
  text-align: center;
  margin-bottom: var(--cm-space-xl);
}

.section__title {
  font-size: var(--cm-font-size-2xl);
  color: var(--cm-text-primary);
  margin-bottom: var(--cm-space-sm);
}

.section__subtitle {
  color: var(--cm-text-secondary);
  font-size: var(--cm-font-size-lg);
}

/* ---- Card Grid ---- */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: var(--cm-space-lg);
}

.card-grid--sm {
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
}

/* ===== Components Library ===== */

/* ---- Buttons ---- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--cm-space-sm);
  padding: 12px 24px;
  border-radius: var(--cm-radius);
  font-size: var(--cm-font-size-base);
  font-weight: 600;
  transition: var(--cm-transition);
  white-space: nowrap;
}

.btn--primary {
  background: var(--cm-primary);
  color: var(--cm-white);
}

.btn--primary:hover {
  background: var(--cm-primary-dark);
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(0,166,80,0.35);
}

.btn--outline {
  background: transparent;
  color: var(--cm-primary);
  border: 1.5px solid var(--cm-primary);
}

.btn--outline:hover {
  background: var(--cm-primary-light);
}

.btn--lg {
  padding: 14px 32px;
  font-size: var(--cm-font-size-lg);
  border-radius: var(--cm-radius-lg);
}

/* ---- Category Card ---- */
.category-card {
  background: var(--cm-bg-card);
  border-radius: var(--cm-radius-lg);
  padding: var(--cm-space-xl);
  box-shadow: var(--cm-shadow);
  transition: var(--cm-transition);
  display: flex;
  flex-direction: column;
  gap: var(--cm-space-md);
  cursor: pointer;
  border: 1.5px solid transparent;
}

.category-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--cm-shadow-hover);
  border-color: var(--cm-primary);
}

.category-card__icon {
  width: 56px;
  height: 56px;
  border-radius: var(--cm-radius);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  color: var(--cm-white);
}

.category-card__title {
  font-size: var(--cm-font-size-xl);
  font-weight: 700;
  color: var(--cm-text-primary);
}

.category-card__desc {
  color: var(--cm-text-secondary);
  font-size: var(--cm-font-size-sm);
  line-height: 1.6;
  flex: 1;
}

.category-card__meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: var(--cm-font-size-sm);
  color: var(--cm-text-light);
}

.category-card__count {
  display: flex;
  align-items: center;
  gap: 4px;
}

.category-card__arrow {
  color: var(--cm-primary);
  font-weight: 600;
  font-size: var(--cm-font-size-sm);
  display: flex;
  align-items: center;
  gap: 4px;
}

/* ---- Article Card ---- */
.article-card {
  background: var(--cm-bg-card);
  border-radius: var(--cm-radius-lg);
  padding: var(--cm-space-lg);
  box-shadow: var(--cm-shadow-sm);
  transition: var(--cm-transition);
  display: flex;
  flex-direction: column;
  gap: var(--cm-space-sm);
  border: 1px solid var(--cm-border-light);
}

.article-card:hover {
  box-shadow: var(--cm-shadow-hover);
  border-color: var(--cm-primary);
  transform: translateY(-2px);
}

.article-card__tags {
  display: flex;
  gap: var(--cm-space-xs);
  flex-wrap: wrap;
}

.article-card__tag {
  padding: 2px 10px;
  border-radius: 20px;
  font-size: var(--cm-font-size-xs);
  color: var(--cm-primary);
  background: var(--cm-primary-light);
  font-weight: 500;
}

.article-card__title {
  font-size: var(--cm-font-size-lg);
  font-weight: 700;
  color: var(--cm-text-primary);
}

.article-card__summary {
  color: var(--cm-text-secondary);
  font-size: var(--cm-font-size-sm);
  line-height: 1.6;
  flex: 1;
}

.article-card__meta {
  display: flex;
  align-items: center;
  gap: var(--cm-space-md);
  font-size: var(--cm-font-size-xs);
  color: var(--cm-text-light);
}

.article-card__read-time {
  display: flex;
  align-items: center;
  gap: 4px;
}

/* ---- Article List Item ---- */
.article-list-item {
  background: var(--cm-bg-card);
  border-radius: var(--cm-radius);
  padding: var(--cm-space-lg);
  box-shadow: var(--cm-shadow-sm);
  transition: var(--cm-transition);
  display: flex;
  align-items: flex-start;
  gap: var(--cm-space-lg);
  border: 1px solid transparent;
  margin-bottom: var(--cm-space-md);
}

.article-list-item:hover {
  border-color: var(--cm-primary);
  box-shadow: var(--cm-shadow-hover);
}

.article-list-item__num {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--cm-primary-light);
  color: var(--cm-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: var(--cm-font-size-sm);
  flex-shrink: 0;
}

.article-list-item__content {
  flex: 1;
  min-width: 0;
}

.article-list-item__title {
  font-size: var(--cm-font-size-lg);
  font-weight: 600;
  margin-bottom: var(--cm-space-xs);
}

.article-list-item__summary {
  color: var(--cm-text-secondary);
  font-size: var(--cm-font-size-sm);
  margin-bottom: var(--cm-space-sm);
}

.article-list-item__meta {
  display: flex;
  gap: var(--cm-space-md);
  font-size: var(--cm-font-size-xs);
  color: var(--cm-text-light);
  flex-wrap: wrap;
}

/* ---- Breadcrumb ---- */
.breadcrumb {
  display: flex;
  align-items: center;
  gap: var(--cm-space-sm);
  font-size: var(--cm-font-size-sm);
  color: var(--cm-text-light);
  margin-bottom: var(--cm-space-lg);
  flex-wrap: wrap;
}

.breadcrumb a {
  color: var(--cm-primary);
  transition: var(--cm-transition);
}

.breadcrumb a:hover { color: var(--cm-primary-dark); }

.breadcrumb__sep {
  color: var(--cm-border);
}

/* ---- Tags ---- */
.tags {
  display: flex;
  gap: var(--cm-space-sm);
  flex-wrap: wrap;
  margin-bottom: var(--cm-space-md);
}

.tag {
  padding: 4px 14px;
  border-radius: 20px;
  font-size: var(--cm-font-size-xs);
  background: var(--cm-primary-light);
  color: var(--cm-primary);
  font-weight: 500;
}

/* ---- Highlight / CTA Box ---- */
.highlight-box {
  background: linear-gradient(135deg, #E8F5E9, #F1F8E9);
  border-left: 4px solid var(--cm-primary);
  border-radius: var(--cm-radius);
  padding: var(--cm-space-lg);
  margin: var(--cm-space-lg) 0;
}

.highlight-box h4 {
  color: var(--cm-primary-dark);
  margin-bottom: var(--cm-space-sm);
  font-size: var(--cm-font-size-base);
}

.cta-box {
  background: linear-gradient(135deg, var(--cm-primary), var(--cm-primary-dark));
  color: var(--cm-white);
  border-radius: var(--cm-radius-lg);
  padding: var(--cm-space-xl);
  margin: var(--cm-space-xl) 0;
  text-align: center;
}

.cta-box h3 {
  font-size: var(--cm-font-size-xl);
  margin-bottom: var(--cm-space-sm);
}

.cta-box p {
  margin-bottom: var(--cm-space-md);
  opacity: 0.9;
}

.cta-box .btn--outline {
  color: var(--cm-white);
  border-color: var(--cm-white);
}

/* ---- Sidebar ---- */
.sidebar {
  position: sticky;
  top: calc(var(--cm-header-height) + 24px);
}

.sidebar__section {
  background: var(--cm-bg-card);
  border-radius: var(--cm-radius-lg);
  padding: var(--cm-space-lg);
  box-shadow: var(--cm-shadow-sm);
  margin-bottom: var(--cm-space-lg);
}

.sidebar__title {
  font-size: var(--cm-font-size-base);
  font-weight: 600;
  margin-bottom: var(--cm-space-md);
  padding-bottom: var(--cm-space-sm);
  border-bottom: 2px solid var(--cm-primary-light);
}

.sidebar__link {
  display: flex;
  align-items: center;
  gap: var(--cm-space-sm);
  padding: var(--cm-space-sm) var(--cm-space-sm);
  border-radius: var(--cm-radius-sm);
  font-size: var(--cm-font-size-sm);
  color: var(--cm-text-secondary);
  transition: var(--cm-transition);
  margin-bottom: var(--cm-space-xs);
}

.sidebar__link:hover {
  color: var(--cm-primary);
  background: var(--cm-primary-light);
}

/* ---- Article Navigation ---- */
.article-nav {
  display: flex;
  justify-content: space-between;
  gap: var(--cm-space-md);
  margin-top: var(--cm-space-2xl);
  padding-top: var(--cm-space-xl);
  border-top: 1px solid var(--cm-border);
}

.article-nav__link {
  flex: 1;
  max-width: 48%;
  padding: var(--cm-space-md);
  border-radius: var(--cm-radius);
  background: var(--cm-bg-card);
  border: 1px solid var(--cm-border-light);
  transition: var(--cm-transition);
}

.article-nav__link:hover {
  border-color: var(--cm-primary);
  box-shadow: var(--cm-shadow-hover);
}

.article-nav__label {
  font-size: var(--cm-font-size-xs);
  color: var(--cm-text-light);
  margin-bottom: 4px;
}

.article-nav__title {
  font-size: var(--cm-font-size-sm);
  font-weight: 600;
  color: var(--cm-text-primary);
}

/* ---- Search Overlay ---- */
.search-overlay {
  position: fixed;
  inset: 0;
  z-index: 300;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  display: flex;
  justify-content: center;
  padding-top: 15vh;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}

.search-overlay--open {
  opacity: 1;
  pointer-events: auto;
}

.search-overlay__inner {
  width: 90%;
  max-width: 640px;
  max-height: 70vh;
  display: flex;
  flex-direction: column;
}

.search-overlay__bar {
  display: flex;
  align-items: center;
  gap: var(--cm-space-md);
  background: var(--cm-white);
  border-radius: var(--cm-radius-lg);
  padding: var(--cm-space-md) var(--cm-space-lg);
  box-shadow: var(--cm-shadow-md);
}

.search-overlay__input {
  flex: 1;
  border: none;
  outline: none;
  font-size: var(--cm-font-size-lg);
  background: transparent;
}

.search-overlay__close {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--cm-radius-sm);
  flex-shrink: 0;
}

.search-overlay__results {
  background: var(--cm-white);
  border-radius: var(--cm-radius-lg);
  margin-top: var(--cm-space-sm);
  max-height: 50vh;
  overflow-y: auto;
  box-shadow: var(--cm-shadow-md);
}

.search-result-item {
  display: flex;
  flex-direction: column;
  padding: var(--cm-space-md) var(--cm-space-lg);
  border-bottom: 1px solid var(--cm-border-light);
  transition: var(--cm-transition);
}

.search-result-item:hover {
  background: var(--cm-bg-hover);
}

.search-result-cat {
  font-size: var(--cm-font-size-xs);
  color: var(--cm-primary);

/* ===== Utility Functions ===== */

/** Debounce: delays fn until `delay` ms after last call */
function debounce(fn, delay = 300) {
  let timer;
  return function (...args) {
    clearTimeout(timer);
    timer = setTimeout(() => fn.apply(this, args), delay);
  };
}

/** Parse hash route: returns { page, params } */
function parseRoute() {
  const hash = window.location.hash.slice(1) || '/home';
  const [path, query] = hash.split('?');
  const segments = path.split('/').filter(Boolean);
  const params = {};
  if (query) {
    query.split('&').forEach(p => {
      const [k, v] = p.split('=');
      if (k) params[decodeURIComponent(k)] = decodeURIComponent(v || '');
    });
  }

  let page = 'home';
  if (segments[0] === 'category' && segments[1]) {
    page = 'category';
    params.categoryId = segments[1];
  } else if (segments[0] === 'article' && segments[1]) {
    page = 'article';
    params.articleId = segments[1];
  } else if (segments[0] === 'search') {
    page = 'search';
    params.q = params.q || '';
  }

  return { page, params };
}

/** Format number with commas */
function formatNumber(n) {
  return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

/** Truncate text */
function truncate(text, max = 120) {
  if (text.length <= max) return text;
  return text.slice(0, max).replace(/\s+\S*$/, '') + '...';
}

/** Strip HTML tags */
function stripHtml(html) {
  const div = document.createElement('div');
  div.innerHTML = html;
  return div.textContent || div.innerText || '';
}

/** Get category by id */

/** Get article by id */
function getArticle(articles, id) {
  return articles.find(a => a.id === id);
}

/** Get articles for a category */
function getCategoryArticles(articles, categoryId) {
  return articles.filter(a => a.categoryId === categoryId);
}

/** Get related articles */
function getRelatedArticles(articles, currentId, relatedIds) {
  if (relatedIds) return relatedIds.map(id => getArticle(articles, id)).filter(Boolean);
  const current = getArticle(articles, currentId);
  if (!current) return [];
  return articles.filter(a => a.categoryId === current.categoryId && a.id !== currentId).slice(0, 3);
}

let currentRoute = null;
const routeChangeCallbacks = [];

/** Register route change listener */
function onRouteChange(callback) {
  routeChangeCallbacks.push(callback);
}

  window.location.hash = hash;

function getCurrentRoute() {

function initRouter(parseFn) {
  function handleRoute() {
    const route = parseFn();
    currentRoute = route;
    routeChangeCallbacks.forEach(cb => {

/**
 * Multi-field weighted fuzzy search
 * Returns articles sorted by relevance score (descending)
 */
function searchArticles(articles, query) {
  if (!query || query.trim().length === 0) return [];

  const q = query.trim().toLowerCase();
  const results = [];

  for (const article of articles) {
    let score = 0;
    const title = article.title.toLowerCase();
    const summary = article.summary.toLowerCase();
    const tags = (article.tags || []).join(' ').toLowerCase();

    // Exact match bonus
    if (title === q) score += 50;
    if (title.includes(q)) score += 20;
    // Word match
    const words = q.split(/\s+/);
    for (const word of words) {
      if (word.length < 1) continue;
      if (title.includes(word)) score += 10;
      if (tags.includes(word)) score += 8;
      if (summary.includes(word)) score += 5;
    }
    // Partial match on shorter queries
    if (q.length >= 2) {

      if (pos !== -1) score += 15 - pos * 0.1; // earlier match = better
      pos = tags.indexOf(q);
      if (pos !== -1) score += 8;
    }

    if (score > 0) {
      results.push({ article, score });
    }
  }

  results.sort((a, b) => b.score - a.score);
  return results.map(r => r.article);

      <p>ADSL（非对称数字用户线路）利用原有的电话线，实现了上网和通话同时进行。下行速度最高可达 8Mbps-24Mbps。ADSL的"非对称"特性——<strong>下载速度远大于上传速度</strong>——至今仍是家庭宽带的典型特征。</p>

      <h3>光纤宽带（光速时代）</h3>
      <p>光纤宽带是目前最主流的家庭宽带技术。它使用光信号在玻璃纤维中传输数据，速度可达百兆、千兆甚至更高。中国移动目前大力推进光纤到户（FTTH），让千家万户享受高速网络。</p>

      <h2>带宽的单位</h2>

        <tr><td>1000Mbps</td><td>约 100-125MB/s</td><td>8K视频、智能家居多设备</td></tr>
      </table>
      <p>注意：1 Byte（字节）= 8 bits（比特），所以 100M 宽带的实际下载速度大约是 100 ÷ 8 ≈ 12.5MB/秒。</p>

      <h2>光纤通信的基本原理</h2>
      <p>光纤通信是利用<strong>光波在光导纤维中传输信息</strong>的通信方式。简单来说：发送端把电信号转换成光信号（通过激光器或LED），光信号在比头发丝还细的玻璃纤维中传输，到达接收端后再转换回电信号。</p>

      <h2>FTTH（光纤到户）</h2>
      <p><strong>FTTH（Fiber To The Home）</strong>是指光纤直接铺设到用户家门口或室内的接入方式。这是目前最先进的宽带接入方案。整个链路是：</p>

        <li>光猫 → 路由器 → 你的手机/电脑</li>

    content: `
      <h2>基站是如何工作的？</h2>
      <p>基站（Base Station）是移动通信网络中的关键设备。每个基站覆盖一个区域（称为"小区"），你的手机通过无线电波与基站通信，基站再通过光纤连接到核心网络。</p>
      <p>基站覆盖范围一般是<strong>几百米到几公里</strong>，取决于频段、功率和地形。频率越高（如5G的高频段），覆盖范围越小，需要更密的基站布设。</p>

      <h2>基站辐射的真相</h2>
      <p><strong>基站辐射属于电磁辐射，不是电离辐射</strong>（如X光、核辐射）。两者的区别：</p>
      <ul>
        <li>电离辐射有足够能量破坏分子结构，可能致癌</li>
        <li>电磁辐射能量很低，主要效应是"热效应"（让物体微微升温）</li>
      </ul>
      <p>我国对基站电磁辐射有严格标准（GB 8702），<strong>比国际标准更严格</strong>。基站的电磁辐射水平远低于安全限值，通常只有限值的几十分之一甚至几百分之一。</p>

      <h2>"基站越多辐射越大"是错的</h2>
      <p>恰恰相反：<strong>基站越密，手机和基站通信所需的发射功率就越小</strong>。因为手机不用"喊"那么大声了。所以基站越密，你受到的总体电磁辐射反而越小。</p>
    `
  },

      <h2>什么是携号转网？</h2>

      <h2>携号转网的条件</h2>
      <ul>
        <li>✅ 手机号已在当前运营商实名认证</li>
        <li>✅ 手机号处于正常使用状态（未欠费、未停机）</li>
        <li>✅ 与当前运营商无在网约定期限限制（合约到期或已解约）</li>
        <li>✅ 距上次携号转网已满 120 天</li>
        <li>✅ 手机号为本人身份证办理</li>
      </ul>

      <h2>携号转网流程</h2>
      <ol>
        <li><strong>查询资格</strong>：编辑短信 "CXXZ#姓名#身份证号" 发送到原运营商（移动10086/联通10010/电信10001），查询是否符合转网条件</li>
        <li><strong>申请授权码</strong>：符合条件后，编辑 "SQXZ#姓名#身份证号" 发送到原运营商，获取携转授权码（有效期1小时）</li>

/** Main render dispatch */
function renderPage(route, categories, articles) {
  switch (route.page) {
    case 'home': return renderHome(categories, articles);
    case 'category': return renderCategoryPage(route.params.categoryId, categories, articles);
    case 'article': return renderArticlePage(route.params.articleId, categories, articles);
    case 'search': return renderSearchPage(route.params.q || '', articles);
    default: return renderHome(categories, articles);
  }
}

/** Update desktop nav active state */
function updateNavActive(route) {
  document.querySelectorAll('.header__nav-link').forEach(link => {
    link.classList.remove('header__nav-link--active');
  });
  let activeCat = '';
  if (route.page === 'category') activeCat = route.params.categoryId;
  if (route.page === 'article') {
    // Could determine from article data but nav highlights are simpler with data attribute
  }
  const match = document.querySelector(`[data-nav="${activeCat}"]`);
  if (match) match.classList.add('header__nav-link--active');
}

function renderCategoryCard(cat, articles) {
  const count = getCategoryArticles(articles, cat.id).length;
  const colors = ['#00A650','#2196F3','#FF6B00','#7C4DFF','#E91E63','#00BCD4'];
  const bg = colors[cat.order % colors.length];
  return `
    <a href="#/category/${cat.id}" class="category-card">
      <div class="category-card__icon" style="background:${bg}">${cat.icon}</div>
      <div class="category-card__title">${cat.name}</div>
      <div class="category-card__desc">${cat.description}</div>
      <div class="category-card__meta">
        <span class="category-card__count">📄 ${count} 篇文章</span>
        <span class="category-card__arrow">查看全部 →</span>
      </div>
    </a>
  `;
}

function renderArticleCard(article, categories) {
  const cat = categories.find(c => c.id === article.categoryId);
  const tags = (article.tags || []).slice(0, 2);
  return `
    <a href="#/article/${article.id}" class="article-card">
      <div class="article-card__tags">
        ${tags.map(t => `<span class="article-card__tag">${t}</span>`).join('')}
      </div>
      <div class="article-card__title">${article.title}</div>
      <div class="article-card__summary">${article.summary}</div>
      <div class="article-card__meta">
        ${cat ? `<span>📂 ${cat.name}</span>` : ''}
        <span class="article-card__read-time">⏱ ${article.readTime} 分钟阅读</span>
      </div>
    </a>
  `;
}

/* ==================== CATEGORY PAGE ==================== */
function renderCategoryPage(categoryId, categories, articles) {
  const cat = categories.find(c => c.id === categoryId);
  if (!cat) return '<div class="container section"><p>分类不存在</p></div>';

  const catArticles = getCategoryArticles(articles, categoryId).sort((a, b) => a.order - b.order);
  const colors = ['#00A650','#2196F3','#FF6B00','#7C4DFF','#E91E63','#00BCD4'];
  const bg = colors[cat.order % colors.length];

  const otherCats = categories.filter(c => c.id !== categoryId);

  return `
    <div class="category-header">
      <div class="category-header__icon" style="background:${bg}">${cat.icon}</div>
      <h1 class="category-header__title">${cat.name}</h1>
      <p class="category-header__desc">${cat.description}</p>
    </div>

    <section class="category-page">
      <div class="container">
        <div class="category-page__layout">
          <main class="category-page__main">
            ${catArticles.map((a, i) => renderArticleListItem(a, i + 1)).join('')}
            ${catArticles.length === 0 ? '<p style="text-align:center;color:var(--cm-text-light);padding:48px">该分类暂无文章</p>' : ''}
          </main>

          <aside class="sidebar">
            <div class="sidebar__section">
              <h4 class="sidebar__title">📂 其他分类</h4>
              ${otherCats.map(c => `
                <a href="#/category/${c.id}" class="sidebar__link">${c.icon} ${c.name}</a>
              `).join('')}
            </div>
            ${catArticles.length > 0 ? `
            <div class="sidebar__section">
              <h4 class="sidebar__title">🔥 推荐文章</h4>
              ${catArticles.filter(a => a.featured).slice(0, 3).map(a => `
                <a href="#/article/${a.id}" class="sidebar__link" style="font-size:13px">📄 ${a.title}</a>
              `).join('')}
            </div>
            ` : ''}
          </aside>
        </div>
      </div>
    </section>
  `;
}

function renderArticleListItem(article, num) {
  const tags = (article.tags || []).slice(0, 3);
  return `
    <a href="#/article/${article.id}" class="article-list-item">
      <span class="article-list-item__num">${String(num).padStart(2, '0')}</span>
      <div class="article-list-item__content">
        <div class="article-list-item__title">${article.title}</div>
        <div class="article-list-item__summary">${article.summary}</div>
        <div class="article-list-item__meta">
          <span>⏱ ${article.readTime} 分钟</span>
          ${tags.map(t => `<span class="tag">${t}</span>`).join('')}
        </div>
      </div>
    </a>
  `;
}

/* ==================== ARTICLE PAGE ==================== */
function renderArticlePage(articleId, categories, articles) {
  const article = getArticle(articles, articleId);
  if (!article) return '<div class="container section"><p>文章不存在</p></div>';

  const cat = categories.find(c => c.id === article.categoryId);
  const tags = article.tags || [];

  // Prev / next
  const catArticles = getCategoryArticles(articles, article.categoryId).sort((a, b) => a.order - b.order);
  const idx = catArticles.findIndex(a => a.id === articleId);
  const prevArticle = idx > 0 ? catArticles[idx - 1] : null;
  const nextArticle = idx < catArticles.length - 1 ? catArticles[idx + 1] : null;

  // Related
  const relatedArticles = article.relatedArticles
    ? article.relatedArticles.map(id => getArticle(articles, id)).filter(Boolean)
    : catArticles.filter(a => a.id !== articleId).slice(0, 3);

  return `
    <article class="article-page">
      <div class="container container--narrow">
        <nav class="breadcrumb" aria-label="面包屑">
          <a href="#/home">首页</a>
          <span class="breadcrumb__sep">›</span>
          ${cat ? `<a href="#/category/${cat.id}">${cat.name}</a>` : ''}
          <span class="breadcrumb__sep">›</span>
          <span>${article.title}</span>
        </nav>

        <header class="article-header">
          <h1 class="article-title">${article.title}</h1>
          <div class="article-meta">
            ${cat ? `<span>📂 ${cat.name}</span>` : ''}
            <span>⏱ ${article.readTime} 分钟阅读</span>
            <span>📅 ${article.date || '2026-05'}</span>
          </div>
          ${tags.length ? `<div class="tags" style="margin-top:12px">${tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>` : ''}
        </header>

        <div class="article-divider"></div>

        <div class="article-content">
          ${article.content}
        </div>

        ${renderCtaBox()}

        <nav class="article-nav" aria-label="上一篇/下一篇">
          ${prevArticle ? `
            <a href="#/article/${prevArticle.id}" class="article-nav__link">
              <div class="article-nav__label">← 上一篇</div>
              <div class="article-nav__title">${prevArticle.title}</div>
            </a>
          ` : '<div></div>'}
          ${nextArticle ? `
            <a href="#/article/${nextArticle.id}" class="article-nav__link" style="text-align:right">
              <div class="article-nav__label">下一篇 →</div>
              <div class="article-nav__title">${nextArticle.title}</div>
            </a>
          ` : '<div></div>'}
        </nav>
      </div>
    </article>

    ${relatedArticles.length ? `
    <section class="related-articles">
      <div class="container">
        <h3 class="related-articles__title">📖 相关文章</h3>
        <div class="card-grid card-grid--sm">
          ${relatedArticles.map(a => renderArticleCard(a, categories)).join('')}
        </div>
      </div>
    </section>
    ` : ''}
  `;
}

function renderCtaBox() {
  return `
    <div class="cta-box">
      <h3>📞 需要办理中国移动业务？</h3>
      <p>拨打 10086 或登录中国移动APP，了解更多套餐详情和优惠活动。也可联系您的专属客户经理获取一对一服务。</p>
      <a href="#/category/business-guide" class="btn btn--outline">查看业务指南 →</a>
    </div>
  `;
}

/* ==================== SEARCH PAGE ==================== */
function renderSearchPage(query, articles) {
  let resultsHtml = '';
  if (query) {
    const results = searchArticles(articles, query);
    if (results.length === 0) {
      resultsHtml = '<p style="text-align:center;color:var(--cm-text-light);padding:48px">🔍 未找到与"<strong>' + query + '</strong>"相关的内容，请尝试其他关键词</p>';
    } else {
      resultsHtml = `
        <p style="color:var(--cm-text-light);margin-bottom:16px">找到 <strong>${results.length}</strong> 篇与"<strong>${query}</strong>"相关的文章</p>
        ${results.map(a => renderArticleListItem(a, 0)).join('')}
      `;
    }
  }

  return `
    <section class="search-page">
      <div class="container container--narrow">
        <input type="text" class="search-page__input" id="searchPageInput"
               placeholder="🔍 搜索移动业务知识..." value="${query}"
               autofocus>
        <div id="searchPageResults">
          ${resultsHtml || '<p style="text-align:center;color:var(--cm-text-light);padding:48px">输入关键词开始搜索...</p>'}
        </div>
      </div>
    </section>
  `;
}

var mainContent = document.getElementById("mainContent");
var searchOverlay = document.getElementById("searchOverlay");
var searchInput = document.getElementById("searchInput");
var searchResults = document.getElementById("searchResults");
var searchBtn = document.getElementById("searchBtn");
var searchCloseBtn = document.getElementById("searchCloseBtn");
var mobileNav = document.getElementById("mobileNav");
var mobileOverlay = document.getElementById("mobileOverlay");
var menuBtn = document.getElementById("menuBtn");
var mobileCloseBtn = document.getElementById("mobileCloseBtn");
var backToTop = document.getElementById("backToTop");

function openSearch() {
  searchOverlay.classList.add("search-overlay--open");
  searchInput.focus(); searchInput.value = ""; searchResults.innerHTML = "";
}
function closeSearch() { searchOverlay.classList.remove("search-overlay--open"); }
searchBtn.addEventListener("click", openSearch);
searchCloseBtn.addEventListener("click", closeSearch);
searchOverlay.addEventListener("click", function(e) { if (e.target === searchOverlay) closeSearch(); });
document.addEventListener("keydown", function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === "k") { e.preventDefault(); openSearch(); }
  if (e.key === "Escape") closeSearch();
});
searchInput.addEventListener("input", function(e) {
  var q = e.target.value.trim();
  if (!q) { searchResults.innerHTML = ""; return; }
  var results = searchArticles(articles, q);
  if (results.length === 0) {
    searchResults.innerHTML = '<div class="search-empty">未找到相关内容，试试其他关键词</div>';
    return;
  }
  searchResults.innerHTML = results.slice(0, 15).map(function(a) {
    var cat = categories.find(function(c) { return c.id === a.categoryId; });
    return '<a href="#/article/' + a.id + '" class="search-result-item"><span class="search-result-cat">' + (cat ? cat.name : "") + '</span><span class="search-result-title">' + a.title + '</span><span class="search-result-summary">' + a.summary + '</span></a>';
  }).join("");
  searchResults.querySelectorAll("a").forEach(function(l) { l.addEventListener("click", closeSearch); });
});

function openMobileMenu() {
  mobileNav.classList.add("mobile-nav--open");
  mobileOverlay.classList.add("mobile-nav-overlay--visible");
  mobileOverlay.style.display = "block";
  document.body.style.overflow = "hidden";
}
function closeMobileMenu() {
  mobileNav.classList.remove("mobile-nav--open");
  mobileOverlay.classList.remove("mobile-nav-overlay--visible");
  setTimeout(function() { mobileOverlay.style.display = "none"; }, 300);
  document.body.style.overflow = "";
}
menuBtn.addEventListener("click", openMobileMenu);
mobileCloseBtn.addEventListener("click", closeMobileMenu);
mobileOverlay.addEventListener("click", closeMobileMenu);
document.getElementById("mobileNavLinks").addEventListener("click", function(e) {
  if (e.target.tagName === "A") setTimeout(closeMobileMenu, 200);
});

window.addEventListener("scroll", function() {
  if (backToTop) backToTop.classList.toggle("back-to-top--visible", window.scrollY > 400);
});
if (backToTop) backToTop.addEventListener("click", scrollToTop);

onRouteChange(function(route) {
  if (mainContent) mainContent.innerHTML = renderPage(route, categories, articles);
  updateNavActive(route);
  scrollToTop();
});
initRouter(parseRoute);

})();
  </script>
</body>
